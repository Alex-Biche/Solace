<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>About Solace</title>
  <style>
    :root {
      --solace-purple: #6C5CE7;
      --solace-blue: #74b9ff;
      --solace-lavender: #a29bfe;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 3rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      max-width: 480px;
    }

    .logo {
      width: 128px;
      height: 128px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      background: linear-gradient(135deg, var(--solace-purple), var(--solace-lavender), var(--solace-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .version {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 2rem;
    }

    .info {
      font-size: 0.9rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.6);
    }

    .info a {
      color: var(--solace-lavender);
      text-decoration: none;
    }

    .info a:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 1rem;
      border: 1px solid rgba(108, 92, 231, 0.3);
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--solace-lavender);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="solace-logo.png" alt="Solace" />
    <h1>SOLACE</h1>
    <p class="version">Version 1.0.0 — Built on Gecko</p>
    <div class="info">
      <p>A browser built for focus, privacy, and flow.</p>
      <p>Zero telemetry. No tracking. Your data stays yours.</p>
      <br />
      <p>Based on Mozilla Firefox and the Gecko engine.</p>
      <p>Licensed under the Mozilla Public License 2.0.</p>
    </div>
    <span class="badge">GECKO ENGINE</span>
  </div>
</body>
</html>
